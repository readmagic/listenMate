name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/app/src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Verify version consistency
        run: node scripts/bump-version.js --check

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./packages/app"
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "ListenMate ${{ github.ref_name }}"
          releaseBody: "See ASSETS to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listenmate-${{ matrix.target }}
          path: |
            packages/app/src-tauri/target/${{ matrix.target }}/release/bundle/*
            packages/app/src-tauri/target/release/bundle/*
          if-no-files-found: warn

  build-debian:
    runs-on: ubuntu-22.04
    container:
      image: debian:12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential file pkg-config git \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev libgtk-3-dev \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/app/src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Verify version consistency
        run: node scripts/bump-version.js --check

      - name: Build Tauri app (Debian 12)
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./packages/app"
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "ListenMate ${{ github.ref_name }}"
          releaseBody: "See ASSETS to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listenmate-debian-12
          path: |
            packages/app/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/*
          if-no-files-found: warn
